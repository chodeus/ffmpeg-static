name: Validate workflows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        id: install
        shell: bash
        env:
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca
        run: |
          # The script comes from the commit the tag pointed at (immutable), so a re-pointed tag can't inject code.
          bash <(curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_COMMIT}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION#v}"
          echo "exe=$PWD/actionlint" >> "$GITHUB_OUTPUT"

      - name: Run actionlint
        shell: bash
        env:
          # Skip shellcheck info/style findings; real bugs still fail.
          SHELLCHECK_OPTS: --severity=warning
        run: ${{ steps.install.outputs.exe }} -color
