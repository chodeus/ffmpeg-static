name: build

# Produce static FFmpeg binaries for the latest stable FFmpeg release and
# publish them as a GitHub release. Linux binaries are compiled fully-static
# from pinned upstream source (so they run on musl/Alpine AND glibc); Windows
# binaries are mirrored from the FFmpeg-project-recommended BtbN builds.
#
# The FFmpeg version is auto-detected from the official repo's release tags, so
# new patch, minor AND major releases are built automatically — no edits needed.
#
# Linux and Windows ship independently. BtbN only publishes the branches in their
# own build matrix and adds a new one weeks after upstream tags it, so a fresh
# release goes out Linux-only and a later run backfills the Windows binaries into
# that same release once they exist.
#
# Builds are driven by change, not by the clock: a push that touches the build
# inputs rebuilds immediately, while the daily cron only exists to notice new
# upstream releases (which no push to this repo can announce). A scheduled run
# with nothing new to add — no new version, no newly-available Windows build —
# skips the build entirely.

on:
  push:
    branches: [main]
    paths:
      - 'linux/**'
      - '.github/workflows/mirror.yml'
  pull_request:
    branches: [main]
    paths:
      - 'linux/**'
      - '.github/workflows/mirror.yml'
  schedule:
    - cron: '17 5 * * *'   # poll upstream; skips unless there's a new release
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: 'Optional: pin an FFmpeg release tag (e.g. n8.1.1). Leave blank to auto-detect the newest stable release.'
        default: ''
        required: false

# Least privilege: read-only by default; only the release job gets write.
permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ffmpeg_tag: ${{ steps.v.outputs.ffmpeg_tag }}
      version: ${{ steps.v.outputs.version }}
      btbn_branch: ${{ steps.v.outputs.btbn_branch }}
      windows_available: ${{ steps.w.outputs.windows_available }}
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Detect latest stable FFmpeg release
        id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.ffmpeg_tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            # Highest nX.Y[.Z] release tag from the official FFmpeg repo. Picks up
            # new patch/minor/major releases automatically; ignores -dev/-rc tags.
            VER=$(git ls-remote --tags --refs https://github.com/FFmpeg/FFmpeg.git \
              | grep -oE 'refs/tags/n[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sed 's#refs/tags/n##' \
              | sort -V | tail -1)
            TAG="n${VER}"
          fi
          VERSION="${TAG#n}"
          BTBN_BRANCH="n$(echo "$VERSION" | cut -d. -f1-2)"
          echo "ffmpeg_tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"         >> "$GITHUB_OUTPUT"
          echo "btbn_branch=$BTBN_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved FFmpeg $VERSION (tag $TAG; BtbN Windows branch $BTBN_BRANCH)"

      # Decide Windows availability here, from a positive check against BtbN's
      # asset list — never by inferring it from a download or checksum error, so
      # the mirror job below can keep treating every failure as fatal.
      - name: Check whether BtbN publishes this branch yet
        id: w
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.v.outputs.btbn_branch }}
        run: |
          set -euo pipefail
          VL="${BRANCH#n}"
          names=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name')
          avail=true
          for plat in win64 winarm64; do
            grep -qxF "ffmpeg-${BRANCH}-latest-${plat}-gpl-${VL}.zip" <<<"$names" || avail=false
          done
          echo "windows_available=$avail" >> "$GITHUB_OUTPUT"
          if [ "$avail" = false ]; then
            echo "::warning::BtbN publishes no ${BRANCH} Windows build yet — releases stay Linux-only until it appears."
          fi
          echo "BtbN ${BRANCH} Windows builds available: ${avail}"

      # A push or a manual run means the build inputs themselves changed, so it
      # always builds. The cron is only a poll: it builds for a version that is
      # not published yet, or to backfill Windows into a Linux-only release that
      # BtbN can now supply. "Published" alone must not stop it — that would
      # strand such a release with no Windows binaries forever.
      - name: Decide whether a build is needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.v.outputs.version }}
          BRANCH: ${{ steps.v.outputs.btbn_branch }}
          WIN_AVAIL: ${{ steps.w.outputs.windows_available }}
        run: |
          set -euo pipefail
          # All four, not just one: a partial upload must not read as complete, or
          # the missing binaries are never restored. Subtraction matches on equality.
          WANT='["ffmpeg-win64.exe","ffprobe-win64.exe","ffmpeg-winarm64.exe","ffprobe-winarm64.exe"]'
          BUILD=true
          if [ "$EVENT" != "schedule" ]; then
            echo "Event ${EVENT} — building."
          elif ! gh release view "n${VERSION}" >/dev/null 2>&1; then
            echo "n${VERSION} is not published yet — building."
          elif [ "$(gh release view "n${VERSION}" --json assets \
                    --jq "$WANT - [.assets[].name] | length == 0")" = true ]; then
            echo "n${VERSION} is published with every Windows binary — nothing to do."
            BUILD=false
          elif [ "$WIN_AVAIL" = true ]; then
            echo "n${VERSION} is missing Windows binaries and BtbN publishes ${BRANCH} — building to backfill."
          else
            echo "n${VERSION} is missing Windows binaries and BtbN still has no ${BRANCH} build — nothing to do."
            BUILD=false
          fi
          echo "should_build=$BUILD" >> "$GITHUB_OUTPUT"

  linux:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: linux64,    runner: ubuntu-24.04 }
          - { arch: linuxarm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build + self-test static ffmpeg (${{ matrix.arch }})
        env:
          FFMPEG_TAG: ${{ needs.resolve.outputs.ffmpeg_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # The 'test' stage compiles everything and, on a clean Alpine image,
          # asserts the binary is statically linked and encodes/decodes on musl.
          # Building it here is the gate; a failure fails the job.
          docker buildx build --target test --load \
            --build-arg FFMPEG_TAG="${FFMPEG_TAG}" \
            -t "ffstatic:${ARCH}" \
            -f linux/Dockerfile linux/
          cid=$(docker create "ffstatic:${ARCH}")
          docker cp "$cid":/usr/local/bin/ffmpeg  "ffmpeg-${ARCH}"
          docker cp "$cid":/usr/local/bin/ffprobe "ffprobe-${ARCH}"
          docker rm "$cid" >/dev/null
          # Re-assert on the extracted artifacts what the test stage asserted
          # in-image; see linux/Dockerfile for why INTERP/NEEDED and not file(1).
          for b in "ffmpeg-${ARCH}" "ffprobe-${ARCH}"; do
            hdr=$(readelf -lW "$b")
            case "$hdr" in *INTERP*) echo "$b needs a dynamic loader"; exit 1;; esac
            dyn=$(readelf -dW "$b")
            case "$dyn" in *NEEDED*) echo "$b has dynamic dependencies"; exit 1;; esac
          done
          # The Alpine test stage can only prove the musl half of the portability
          # claim in linux/Dockerfile's header. The runner is glibc, so exercise
          # the binary here for the other half — an encode/decode round trip is
          # enough, since codec coverage is already proven on musl and what is in
          # question is only whether it loads and runs against a different libc.
          chmod +x "ffmpeg-${ARCH}" "ffprobe-${ARCH}"
          ./"ffprobe-${ARCH}" -hide_banner -version | head -1
          ./"ffmpeg-${ARCH}" -hide_banner -f lavfi -i "sine=frequency=440:duration=1" \
            -c:a libopus /tmp/glibc.opus -y >/dev/null 2>&1
          ./"ffmpeg-${ARCH}" -v error -xerror -nostdin -i /tmp/glibc.opus -map 0:a -f null -
          echo "RUNS-ON-GLIBC OK (${ARCH})"

      # Fail the build (before the artifact upload that feeds the release job) on
      # any *fixable* HIGH/CRITICAL in the test-stage image (Alpine base + binutils).
      # ignore-unfixed skips OS CVEs with no upstream patch yet; the base image is
      # pinned by digest above and kept current by Renovate, so a fixable finding
      # here means bumping that pin.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ffstatic:${{ matrix.arch }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.arch }}
          path: |
            ffmpeg-${{ matrix.arch }}
            ffprobe-${{ matrix.arch }}
          if-no-files-found: error

  # Skipped, not failed, when BtbN has no build for this branch — resolve already
  # confirmed the assets exist, so every failure below is a real one.
  windows:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true' && needs.resolve.outputs.windows_available == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ needs.resolve.outputs.btbn_branch }}
    steps:
      - name: Mirror BtbN Windows static GPL builds
        run: |
          set -euo pipefail
          VL="${BRANCH#n}"
          mkdir -p work out && cd work
          gh release download latest -R BtbN/FFmpeg-Builds -p checksums.sha256 --clobber
          for plat in win64 winarm64; do
            asset="ffmpeg-${BRANCH}-latest-${plat}-gpl-${VL}.zip"
            echo "::group::${plat} (${asset})"
            gh release download latest -R BtbN/FFmpeg-Builds -p "$asset" --clobber
            sha256sum --ignore-missing -c checksums.sha256 > verify.log 2>&1 || true
            grep -F "${asset}: OK" verify.log || { echo "checksum FAILED for ${asset}"; cat verify.log; exit 1; }
            rm -rf "x_${plat}"; mkdir "x_${plat}"; unzip -q "$asset" -d "x_${plat}"
            ff=$(find "x_${plat}" -type f -name ffmpeg.exe  | head -1)
            fp=$(find "x_${plat}" -type f -name ffprobe.exe | head -1)
            [ -n "$ff" ] && [ -n "$fp" ] || { echo "binaries not found in ${asset}"; exit 1; }
            cp "$ff" "../out/ffmpeg-${plat}.exe"
            cp "$fp" "../out/ffprobe-${plat}.exe"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-windows
          path: out/*
          if-no-files-found: error

  # Only main publishes: otherwise a workflow_dispatch on any branch would clobber
  # the live release with binaries built from unreviewed code.
  release:
    needs: [resolve, linux, windows]
    # Linux is a hard gate. A *skipped* mirror (BtbN has no such branch) must not
    # hold the release back, but a *failed* one must: publishing from a partial set
    # would rewrite SHA256SUMS and the notes while the real Windows assets, which
    # --clobber leaves untouched, stay attached to the release.
    if: >-
      ${{ !cancelled()
          && needs.linux.result == 'success'
          && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
          && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create / edit the release
      id-token: write       # OIDC token for provenance signing
      attestations: write   # write the build-provenance attestation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.resolve.outputs.version }}
      BRANCH: ${{ needs.resolve.outputs.btbn_branch }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Assemble, checksum and publish
        id: pub
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( -name 'ffmpeg-*' -o -name 'ffprobe-*' \) -exec cp {} out/ \;
          cd out
          chmod +x ffmpeg-linux* ffprobe-linux* 2>/dev/null || true
          sha256sum ffmpeg-* ffprobe-* > SHA256SUMS
          echo "FFmpeg ${VERSION}"; cat SHA256SUMS

          {
            echo "Static FFmpeg **${VERSION}**."
            echo
            echo "- **Linux** (\`linux64\`, \`linuxarm64\`): compiled fully-static from pinned"
            echo "  upstream source (runs on musl/Alpine and glibc). Audio-focused, **LGPL-3.0**."
            # The Windows bullet is a licensing statement, so it only appears when
            # the binaries it describes are actually attached.
            if [ -e ffmpeg-win64.exe ]; then
              echo "- **Windows** (\`win64\`, \`winarm64\`): mirrored from [BtbN/FFmpeg-Builds](https://github.com/BtbN/FFmpeg-Builds), **GPL-3.0**."
            else
              echo "- **Windows**: not available yet — [BtbN/FFmpeg-Builds](https://github.com/BtbN/FFmpeg-Builds)"
              echo "  does not publish \`${BRANCH}\` builds. They are added to this release"
              echo "  automatically once it does."
            fi
            echo
            echo "Verify with \`SHA256SUMS\`. Provenance + corresponding source: see [NOTICE.md](https://github.com/chodeus/ffmpeg-static/blob/main/NOTICE.md)."
          } > RELEASE_NOTES.md

          TAG="n${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p SHA256SUMS -O old_SHA256SUMS --clobber || true
            if [ -f old_SHA256SUMS ] && cmp -s old_SHA256SUMS SHA256SUMS; then
              echo "No change for ${TAG} — skipping."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release upload "$TAG" ffmpeg-* ffprobe-* SHA256SUMS --clobber
            # Keep title/notes/latest accurate too (not just assets).
            gh release edit "$TAG" \
              --title "FFmpeg ${VERSION} (static)" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "$TAG" ffmpeg-* ffprobe-* SHA256SUMS \
              --title "FFmpeg ${VERSION} (static)" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Cryptographic, verifiable proof that these exact binaries were built by
      # this workflow from this commit (SLSA provenance via Sigstore). Verify with:
      #   gh attestation verify <binary> --repo chodeus/ffmpeg-static
      # Runs on every build (not gated on publish): the from-source builds are
      # reproducible, so a rebuild is usually a no-change skip — but we still want
      # the binaries currently in the release to carry a fresh attestation.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            out/ffmpeg-*
            out/ffprobe-*
