name: Validate workflows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install actionlint
        id: install
        shell: bash
        run: |
          # download-actionlint.bash pinned to the rhysd/actionlint v1.7.12 commit
          # (immutable ref) so a re-pointed tag can't inject code into CI.
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
          echo "exe=$PWD/actionlint" >> "$GITHUB_OUTPUT"

      - name: Run actionlint
        shell: bash
        env:
          # Skip shellcheck info/style findings; real bugs still fail.
          SHELLCHECK_OPTS: --severity=warning
        run: ${{ steps.install.outputs.exe }} -color
